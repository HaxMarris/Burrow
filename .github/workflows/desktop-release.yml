# Builds the desktop app for Windows, macOS and Linux.
#
# - Publish a release on GitHub (Releases > Draft a new release, tag e.g. v0.1.0)
#   and the installers are attached to it for your friends to download.
# - Or run it by hand from the Actions tab to get test builds as downloadable artifacts.
name: Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: desktop
      - run: npm run dist -- --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: burrow-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
