# Keep each service's logs to 30 MB on disk; Docker otherwise keeps them forever.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  burrow:
    build: .
    restart: unless-stopped
    logging: *logging
    ports:
      # Only Caddy (on this machine) talks to Burrow directly. Set BURROW_BIND=0.0.0.0 in .env
      # to reach it on port 3000 from other machines without a reverse proxy.
      - "${BURROW_BIND:-127.0.0.1}:3000:3000"
    environment:
      # All settings live in a .env file next to this one (copy .env.example),
      # so updating Burrow never touches your edits.
      REGISTRATION_CODE: ${REGISTRATION_CODE:?Set REGISTRATION_CODE in .env (copy .env.example to .env)}
      # Voice rooms (see README).
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Burrow talks to LiveKit directly to take removed people out of voice rooms.
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://host.docker.internal:7880}
      # GIF picker (see README).
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      GIF_RATING: ${GIF_RATING:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      # Who can open the admin page (usernames, comma-separated); the first account if empty.
      ADMIN_USERS: ${ADMIN_USERS:-}
      # Uptime: an address pinged every five minutes (see README).
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      # Fire decorations and marshmallows: all unlocked unless this is "hours" (see README).
      FIRE_UNLOCKS: ${FIRE_UNLOCKS:-}
      # Off-site copies of backups and uploads, to any S3-style storage (see README).
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - burrow-data:/data

  # LiveKit carries the audio for voice rooms. It only starts when .env has
  # COMPOSE_PROFILES=voice. Host networking lets it see the real network for calls.
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    profiles: ["voice"]
    logging: *logging
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        logging:
          level: info

  # Installs updates when the host asks for one on the admin page. It only starts when .env's
  # COMPOSE_PROFILES includes "updates". It can control Docker on this machine, which is what lets
  # it rebuild Burrow; it only ever runs scripts/updater.sh.
  updater:
    image: docker:28.3.3-cli
    restart: unless-stopped
    profiles: ["updates"]
    logging: *logging
    working_dir: /repo
    entrypoint: ["sh", "/repo/scripts/updater.sh"]
    volumes:
      - .:/repo
      - burrow-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  burrow-data:
