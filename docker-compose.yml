services:
  burrow:
    build: .
    restart: unless-stopped
    ports:
      # Only Caddy (on this machine) talks to Burrow directly. Set BURROW_BIND=0.0.0.0 in .env
      # to reach it on port 3000 from other machines without a reverse proxy.
      - "${BURROW_BIND:-127.0.0.1}:3000:3000"
    environment:
      # All settings live in a .env file next to this one (copy .env.example),
      # so updating Burrow never touches your edits.
      REGISTRATION_CODE: ${REGISTRATION_CODE:?Set REGISTRATION_CODE in .env (copy .env.example to .env)}
      # Voice rooms (see README).
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - burrow-data:/data

  # LiveKit carries the audio for voice rooms. It only starts when .env has
  # COMPOSE_PROFILES=voice. Host networking lets it see the real network for calls.
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    profiles: ["voice"]
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        logging:
          level: info

volumes:
  burrow-data:
